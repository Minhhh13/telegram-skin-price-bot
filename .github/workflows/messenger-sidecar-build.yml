name: Messenger sidecar build

on:
  workflow_dispatch:
  push:
    paths:
      - 'prototype/messenger-sidecar/**'
      - '.github/workflows/messenger-sidecar-build.yml'
  pull_request:
    paths:
      - 'prototype/messenger-sidecar/**'
      - '.github/workflows/messenger-sidecar-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/messenger-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compile and test
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go test -mod=mod ./...
          go build -mod=mod -trimpath -ldflags='-s -w' -o messenger-sidecar .
